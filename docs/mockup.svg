<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 780" width="380" height="780" font-family="-apple-system, Segoe UI, Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f0"/>
      <stop offset="1" stop-color="#e9e9e3"/>
    </linearGradient>
  </defs>

  <!-- phone body -->
  <rect x="10" y="10" width="360" height="760" rx="38" ry="38" fill="#1b1b1b"/>
  <rect x="20" y="20" width="340" height="740" rx="30" ry="30" fill="url(#bg)"/>

  <!-- status bar -->
  <text x="40" y="50" font-size="13" fill="#222">9:41</text>
  <text x="300" y="50" font-size="13" fill="#222" text-anchor="end">100%</text>

  <!-- top app bar -->
  <line x1="20" y1="70" x2="360" y2="70" stroke="#cfcfc8" stroke-width="1"/>
  <!-- brand seal: 红杉 tree -->
  <rect x="40" y="80" width="26" height="26" rx="6" fill="#2f6f7a"/>
  <path d="M53 83.25 L56.79 90.29 L54.63 90.29 L58.42 97.88 L47.58 97.88 L51.38 90.29 L49.21 90.29 Z" fill="#fff"/>
  <rect x="51.375" y="97.875" width="3.25" height="4.875" fill="#fff"/>
  <text x="74" y="100" font-size="18" font-weight="700" fill="#111">红杉阅读 · Sequoia</text>
  <rect x="306" y="80" width="26" height="20" rx="4" fill="none" stroke="#111" stroke-width="1.6"/>
  <line x1="311" y1="86" x2="327" y2="86" stroke="#111" stroke-width="1.4"/>
  <line x1="311" y1="91" x2="327" y2="91" stroke="#111" stroke-width="1.4"/>
  <line x1="311" y1="96" x2="327" y2="96" stroke="#111" stroke-width="1.4"/>

  <!-- book shelf hint -->
  <text x="40" y="130" font-size="13" fill="#666">我的书架</text>
  <g fill="#ffffff" stroke="#c8c8c0" stroke-width="1.2">
    <rect x="40" y="142" width="92" height="120" rx="6"/>
    <rect x="148" y="142" width="92" height="120" rx="6"/>
    <rect x="256" y="142" width="92" height="120" rx="6"/>
  </g>
  <text x="48" y="250" font-size="11" fill="#444">三体.epub</text>
  <text x="156" y="250" font-size="11" fill="#444">笔记.txt</text>
  <text x="264" y="250" font-size="11" fill="#444">手册.mobi</text>

  <line x1="20" y1="290" x2="360" y2="290" stroke="#e0e0d8" stroke-width="1"/>

  <!-- reading area -->
  <text x="40" y="324" font-size="15" font-weight="700" fill="#111">第一章 · 静夜思</text>
  <g fill="#333">
    <rect x="40" y="344" width="300" height="6" rx="3"/>
    <rect x="40" y="360" width="280" height="6" rx="3"/>
    <rect x="40" y="376" width="300" height="6" rx="3"/>
    <rect x="40" y="392" width="210" height="6" rx="3"/>
    <rect x="40" y="416" width="300" height="6" rx="3"/>
    <rect x="40" y="432" width="260" height="6" rx="3"/>
  </g>
  <text x="40" y="470" font-size="13" fill="#777">床前明月光，疑是地上霜。</text>
  <text x="40" y="492" font-size="13" fill="#777">举头望明月，低头思故乡。</text>

  <!-- selection + translate hint -->
  <rect x="40" y="480" width="232" height="22" fill="#fff3b0" opacity="0.75"/>
  <circle cx="300" cy="491" r="13" fill="#111"/>
  <text x="300" y="496" font-size="12" fill="#fff" text-anchor="middle">译</text>

  <!-- bottom bar -->
  <line x1="20" y1="690" x2="360" y2="690" stroke="#cfcfc8" stroke-width="1"/>
  <text x="40" y="724" font-size="18" fill="#111" text-anchor="middle">‹</text>
  <text x="190" y="724" font-size="13" fill="#444" text-anchor="middle">12 / 240</text>
  <text x="340" y="724" font-size="18" fill="#111" text-anchor="middle">›</text>
  <text x="190" y="752" font-size="11" fill="#999" text-anchor="middle">墨水屏 · 翻页零动画 · 即时刷新</text>
</svg>
